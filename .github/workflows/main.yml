name: WakaTime status update

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "5 */2 * * *"

jobs:
  update-readme:
    name: Update the WakaTime Stat
    runs-on: ubuntu-latest
    steps:
      - uses: avinal/Profile-Readme-WakaTime@v4
        with:
          # WakaTime API key stored in secrets, do not directly paste it here
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          # Automatic github token
          GITHUB_TOKEN: ${{ github.token }}
          # Branch - newer GitHub repositories have "main" as default branch, change to main in that case, default is master
          BRANCH: "main"
          # Manual Commit messages - write your own messages here
          COMMIT_MSG: "Automated Coding Activity Update :alien:"
  update-readme-with-blog:
    name: Update this repo's README with latest twitter posts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gautamkrishnar/blog-post-workflow@1.9.7
        with:
          comment_tag_name: "DEVDOJO"
          max_post_count: 7
          feed_list: "https://zapier.com/engine/rss/11225281/Akhan"
          commit_message: "7 most recent twitter posts"
          gh_token: ${{ secrets.GITHUB_TOKEN }}
